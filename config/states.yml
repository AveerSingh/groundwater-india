# Display names for the site (T8). The map uses Census 2011 districts and state codes;
# readers know present-day states, so each district also gets `state_now`.
#
# state_2011    clean names for 2011 state codes (the boundary file has typos, e.g.
#               "Arunanchal Pradesh", "Dadara & Nagar Havelli").
# state_now     present-day state/UT where it differs from the 2011 one, by 2011 state
#               code (whole state) or by district code (part of a state).
#               - Telangana formed 2014 from ten 2011 Andhra Pradesh districts.
#               - Ladakh UT formed 2019 from Leh and Kargil.
#               - Dadra & Nagar Haveli and Daman & Diu merged in 2020.
#               Khammam: seven mandals moved to Andhra Pradesh in 2014; the district is
#               shown under Telangana, where most of it lies.
# district_display  boundary-file names that read badly as printed.

