# Raw district name -> Census 2011 district name, by 2-digit state code (of the
# raw state label). Targets must be spelled as in 2011_Dist.shp (DISTRICT field);
# 02_reconcile_names.py fails if one is not. Keys are matched after normalisation
# (upper case, non-alphanumerics removed), so "E. Champaran" == "E Champaran".
#
# A null target marks a post-2011 district with more than one 2011 parent: each
# row is then placed by its coordinates (method `spatial`). Only names listed
# here with null, or rows with no district name, are ever placed spatially.
#
# Comment tags: [rename] official rename; [spelling] variant or typo;
# [new:1] post-2011 district with a single 2011 parent; [label] state label wrong in source.

