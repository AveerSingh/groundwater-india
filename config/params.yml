Mg:   {label: Magnesium, unit: mg/L, column_regex: '^mg\b', years: [2019, 2020, 2021, 2022, 2023, 2024], tier: C}
Na:   {label: Sodium, unit: mg/L, column_regex: '^na\b', years: [2019, 2020, 2021, 2022, 2023, 2024], tier: C}
