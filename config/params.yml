Pb:   {label: Lead, unit: mg/L, column_regex: '^pb(?![a-z])', years: [2024], tier: C}
Zn:   {label: Zinc, unit: mg/L, column_regex: '^zn(?![a-z])', years: [2024], tier: C}
Ni:   {label: Nickel, unit: mg/L, column_regex: '^ni(?![a-z])', years: [2024], tier: C}
