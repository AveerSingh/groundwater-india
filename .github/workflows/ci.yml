name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is built and gated by pages.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make all PY=python
      - run: make validate PY=python
